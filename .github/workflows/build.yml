name: Build Debug APK

on:
  push:
    branches:
      - claude/debug-plans-force-close-VIQaw
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android SDK platform 26
        run: sdkmanager "platforms;android-26" "build-tools;26.0.3"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: callmeter-debug
          path: CallMeter3G/build/outputs/apk/debug/*.apk
          retention-days: 14
